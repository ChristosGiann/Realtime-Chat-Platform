name: realtime-chat-platform

services:
  postgres:
    image: postgres:18
    container_name: realtime-chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: realtime_chat
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_app -d realtime_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data: