name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "codex/**"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore RealtimeChat.sln

      - name: Build backend
        run: dotnet build RealtimeChat.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test RealtimeChat.sln --configuration Release --no-build

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:ui

  stage1-e2e:
    name: Stage 1 browser API and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stage1_e2e
          POSTGRES_USER: stage1_test
          POSTGRES_PASSWORD: stage1_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage1_test -d stage1_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_CONNECTION_STRING: Host=localhost;Port=5432;Database=stage1_e2e;Username=stage1_test;Password=stage1_test_only
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate clean database and verify real browser flows
        run: npm run test:e2e
