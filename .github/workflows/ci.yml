name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "codex/**"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore RealtimeChat.sln

      - name: Build backend
        run: dotnet build RealtimeChat.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test RealtimeChat.sln --configuration Release --no-build

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:ui
